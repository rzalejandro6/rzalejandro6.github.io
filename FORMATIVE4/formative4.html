<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGN UP FORM 2025</title>

  <link rel="stylesheet" href="CSS/grid.css">
  <link rel="stylesheet" href="CSS/style.css">
  <script src="formative4.js" defer></script>
</head>

<body>
  <header>Enter Personal Details</header>

  <main>
    <form id="details">
      <section id="input">
        <div>
          <label for="IDNumber">ID Number:</label>
          <input type="text" name="IDNumber" id="IDNumber" maxlength="9" placeholder="9 number digits only" pattern="\d{9}" required>
        </div>

        <div>
          <label for="Firstname">Firstname:</label>
          <input type="text" name="Firstname" id="Firstname" required>
        </div>

        <div>
          <label for="Middlename">Middlename:</label>
          <input type="text" name="Middlename" id="Middlename" required>
        </div>

        <div>
          <label for="Lastname">Lastname:</label>
          <input type="text" name="Lastname" id="Lastname" required>
        </div>

        <div>
          <label>Gender:</label>
          <label><input type="radio" name="Gender" value="Female" required> Female</label>
          <label><input type="radio" name="Gender" value="Male" required> Male</label>
          <label><input type="radio" name="Gender" value="Nonbinary" required> Nonbinary</label>
        </div>

        <div>
          <label for="bdate">Birthdate:</label>
          <input type="date" name="bdate" id="bdate" required>
        </div>

        <div>
          <input type="reset">
          <button type="submit" id="btnSave">Save</button>
        </div>
        <p>*Mulltiple data can be entered</p>
      </section>
    </form>
  </main>
</body>
</html>
